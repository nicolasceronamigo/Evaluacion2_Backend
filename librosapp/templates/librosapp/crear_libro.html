{% extends "base.html" %}

{% block title %}
Biblioteca - Crear libro
{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="bg-white bg-opacity-75 p-4 rounded">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="mb-4">Crear libro</h1>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="titulo" class="form-label">
                        Título
                    </label>
                    <input
                        type="text"
                        value="{{ titulo }}"
                        name="titulo"
                        id="titulo"
                        class="form-control"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="autor" class="form-label">
                        Autor
                    </label>
                    <input
                        type="text"
                        value="{{ autor }}"
                        name="autor"
                        id="autor"
                        class="form-control"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="editorial" class="form-label">
                        Editorial
                    </label>
                    <input
                        type="text"
                        value="{{ editorial }}"
                        name="editorial"
                        id="editorial"
                        class="form-control"
                        maxlength="50"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar
                </button>
                <a href="{% url 'libros' %}" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>
            {% if errores %}
            <div class="alert alert-danger mt-4">
                <ul>
                    {% for error in errores %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
        </div>
    </div>
    </div>
</div>

{% endblock %}
